name: Backend branch tests (Home API endpoints)

# Branch- and task-scoped backend regression for `feat/home_video_holodex_frontend`, the Home mock -> real API
# cutover. It runs ONLY the focused endpoint tests Home depends on: recent videos (paging, topic / contentType /
# newest-oldest), the ranking modes Home uses, Oshi Status, the read path's history-bucket resolution, and the API
# Gateway route wiring. It deliberately never runs `pytest` / `pytest tests` (the full backend suite). To widen
# coverage, add a file to the list rather than a directory. When the branch is merged and deleted, delete this
# workflow with it.
on:
  push:
    branches:
      - feat/home_video_holodex_frontend
    paths:
      - "src/**"
      - "terraform/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/backend-home-oshi-branch-tests.yml"
  # NOT `pull_request.branches`: that filters the PR's BASE (target) branch, never its head/source
  # branch. GitHub cannot filter a pull_request trigger by head branch, so the head branch is
  # checked by the job-level `if` below (github.head_ref). The base branch is intentionally
  # unrestricted, so `feat/home_video_holodex_frontend -> develop` (or any base) is covered.
  pull_request:
    paths:
      - "src/**"
      - "terraform/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/backend-home-oshi-branch-tests.yml"

permissions:
  contents: read

# The event name is part of the key, so a push run and a pull_request run for the same commit never cancel
# each other (they are different groups); a newer commit still cancels an older run of the SAME event.
concurrency:
  group: backend-branch-tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  branch-backend-tests:
    # A pull request event runs for every PR in the repo; only this branch's PR is in scope.
    if: github.event_name == 'push' || github.head_ref == 'feat/home_video_holodex_frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the Home endpoint tests (explicit files only, not the full suite)
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/api/test_home_oshi_videos_api.py
          tests/api/test_video_ranking_api.py
          tests/api/test_oshi_status_api.py
          tests/api/test_history_bucket_read_paths.py
          tests/test_api_gateway_routes.py
