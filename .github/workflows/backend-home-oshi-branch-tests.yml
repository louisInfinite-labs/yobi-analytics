name: Backend branch tests (Home Oshi / Holodex archive)

# Branch- and task-scoped backend regression for `fix/home_video_holodex_aws_backend`.
# It deliberately runs ONLY the test files that protect the contracts this branch added or
# changed -- never `pytest` / `pytest tests` (the full backend suite). When the branch is
# merged and deleted, delete this workflow with it; to widen coverage, add a file to the
# explicit list below rather than a directory.
on:
  push:
    branches:
      - fix/home_video_holodex_aws_backend
    paths:
      - "src/**"
      - "scripts/backfill/**"
      - "terraform/api_gateway.tf"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/backend-home-oshi-branch-tests.yml"
  # NOT `pull_request.branches`: that filters the PR's BASE (target) branch, never its head/source
  # branch. GitHub cannot filter a pull_request trigger by head branch, so the head branch is
  # checked by the job-level `if` below (github.head_ref). The base branch is intentionally
  # unrestricted, so `fix/home_video_holodex_aws_backend -> develop` (or any base) is covered.
  pull_request:
    paths:
      - "src/**"
      - "scripts/backfill/**"
      - "terraform/api_gateway.tf"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/backend-home-oshi-branch-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-branch-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  branch-backend-tests:
    # A pull request event runs for every PR in the repo; only this branch's PR is in scope.
    if: github.event_name == 'push' || github.head_ref == 'fix/home_video_holodex_aws_backend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run this branch's backend regression (explicit files only, not the full suite)
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/api/test_home_oshi_videos_api.py
          tests/api/test_video_ranking_api.py
          tests/api/test_oshi_status_api.py
          tests/api/test_read_api.py
          tests/api/test_api_handler.py
          tests/test_api_gateway_routes.py
          tests/analytics/test_video_ranking.py
          tests/analytics/test_video_ranking_reducer_wiring.py
          tests/analytics/test_video_ranking_result.py
          tests/tracking/test_video_master.py
          tests/tracking/test_video_topics.py
          tests/tracking/test_tracking_manifest.py
          tests/tracking/test_tracking_manifest_patch.py
          tests/collection/test_youtube_client.py
          tests/collection/test_history_worker_manifest_patch.py
          tests/test_history_architecture.py
          tests/test_history_worker_scheduler_state.py
          tests/stores/test_dynamodb_store.py
          tests/scripts/backfill/test_backfill_video_topics.py
