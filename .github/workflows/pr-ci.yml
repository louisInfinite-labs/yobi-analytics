name: PR CI

# One generic CI entry point for every pull request that targets `develop`. Test scope follows the files the PR
# changes; the final `pr-required-check` job ALWAYS runs and always reports, so the branch ruleset can require it
# for every PR (a path-filtered workflow reports nothing when no path matches, which would block the PR forever).
# CI only, no deploy. Each group runs an explicit list of focused files -- never the full suite. To widen coverage,
# add a file to the list below rather than a directory.
on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the PR merge commit and both its parents
          persist-credentials: false
      - id: scope
        # For a pull_request event HEAD is the merge commit; HEAD^1 is the base tip, so this is exactly what the PR changes.
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"; echo "$files"
          backend=false; frontend=false
          echo "$files" | grep -qE '^(src|terraform|tests|scripts)/|^requirements\.txt$|^pytest\.ini$|^\.github/workflows/pr-ci\.yml$' && backend=true
          echo "$files" | grep -qE '^frontend/dashboard/|^\.github/workflows/pr-ci\.yml$' && frontend=true
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend-focused-tests:
    needs: detect-scope
    if: needs.detect-scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the focused Home endpoint and pipeline tests (explicit files only, not the full suite)
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/api/test_home_oshi_videos_api.py
          tests/api/test_dashboard_catalog_api.py
          tests/tracking/test_video_topics.py
          tests/analytics/test_video_ranking.py
          tests/scripts/backfill/test_backfill_video_topics.py
          tests/scripts/backfill/test_realign_video_ranking_topics.py
          tests/api/test_video_ranking_api.py
          tests/api/test_oshi_status_api.py
          tests/api/test_subscriber_leaderboard_api.py
          tests/api/test_history_bucket_read_paths.py
          tests/api/test_retired_routes.py
          tests/test_api_gateway_routes.py
          tests/test_terraform_lambda_env_structure.py
          tests/stores/test_history_bucket.py
          tests/stores/test_dynamodb_video_classification.py
          tests/collection/test_history_worker_classification_catchup.py
          tests/collection/test_youtube_client_skip_reasons.py
          tests/test_history_worker_scheduler_state.py
          tests/scripts/backfill/test_backfill_video_classification.py
          tests/test_home_pipeline_end_to_end.py
          tests/tracking/test_creator_master.py
          tests/tracking/test_hololive_theme_colors.py
          tests/codegen/test_generate_creator_registry.py
          tests/api/test_read_api.py
          tests/api/test_historical_data_unavailable.py
          tests/scripts/backfill/test_backfill_graduated_history.py
          tests/api/test_shorts_shelf_filtering.py
          tests/api/test_shorts_exclusive_topic_filters.py
          tests/api/test_cover_mv_premiere_filtering.py
          tests/api/test_livestream_surfaces_classification.py
          tests/api/test_livestream_request_time_classification.py
          tests/tracking/test_video_discovery_shorts.py
          tests/tracking/test_video_master.py
          tests/stores/test_dynamodb_video_short.py
          tests/scripts/backfill/test_backfill_video_shorts.py
          tests/collection/test_youtube_client.py
          tests/collection/test_main.py
          tests/notifications/test_new_video_creator_override.py
          tests/notifications/test_new_video_short_filter.py
          tests/notifications/test_retired_topic_scopes.py
          tests/stores/test_notification_events_store.py
          tests/scripts/test_publish_about_content_line_endings.py
          tests/test_terraform_client_credentials_table.py
          tests/notifications/test_reminder_timing_matrix.py
          tests/notifications/test_notification_dispatcher.py
          tests/api/test_api_handler.py

  frontend-focused-tests:
    needs: detect-scope
    if: needs.detect-scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Run the focused frontend tests (explicit files only, not the full suite)
        run: >
          npx vitest run
          src/features/home-room/model/oshiVideosQuery.test.ts
          src/features/home-room/data/oshiVideos.test.ts
          src/features/home-room/hooks/useOshiVideos.test.tsx
          src/features/home-room/hooks/useLiveStreamVideoPool.test.ts
          src/features/home-room/hooks/useHomeSelectedVideo.test.ts
          src/features/home-room/utils/recentVideosSelection.test.ts
          src/features/home-room/components/RecentVideosSection.test.tsx
          src/features/home-room/components/RecentVideosSection.shelf.test.tsx
          src/features/home-room/components/RecentVideosSection.dynamicTopics.test.tsx
          src/features/oshi-status/data/oshiStatus.test.ts
          src/features/oshi-status/hooks/useOshiStatus.test.tsx
          src/features/oshi-status/hooks/useLastVisit.test.ts
          src/features/oshi-status/components/OshiStatusPanel.test.tsx
          src/pages/home/HomePage.apiCutover.test.tsx
          src/features/live-status/model/creatorStatusSelection.test.ts
          src/features/live-status/hooks/useCreatorStatuses.test.tsx
          src/features/live-status/components/CreatorStatusList.canonicalColor.test.tsx
          src/shared/api/liveStreams.test.ts
          src/shared/api/liveStreamsStore.test.ts
          src/shared/api/hooks/useLiveStreams.test.ts
          src/features/live-schedule/hooks/useWeeklySchedule.test.tsx
          src/shared/i18n/translations.test.ts
          src/entities/creator/data/creatorRegistry.test.ts
          src/features/live-status/components/CreatorStatusList.completeRoster.test.tsx
          src/features/oshi/utils/myOshiCanonicalRoster.test.ts
          src/features/home-room/components/RecentVideosSection.shortFilter.test.tsx
          src/features/home-room/components/NewTagSharedState.test.tsx
          src/features/home-room/utils/latestLiveShelf.test.ts
          src/features/media-player/hooks/useWatchedDuringLive.test.tsx
          src/features/media-player/utils/youtubeIframeApi.test.ts
          src/shared/newContent/newContentTracking.test.ts
          src/shared/newContent/newContentWatchedLive.test.ts
          src/pages/home/HomePage.liveWatch.test.tsx
          src/features/live-status/components/LiveScheduleDock.test.tsx
          src/features/notifications/api/notificationPreferenceApi.test.ts
          src/features/notifications/components/NotificationSettings.shortCard.test.tsx
          src/features/notifications/model/notificationTopicCatalog.test.ts
          src/features/notifications/hooks/useTopicNotificationPreferences.retiredAndRemove.test.ts
          src/features/notifications/hooks/useRetiredTopicResync.test.ts
          src/features/live-status/components/CreatorStatusList.nonIndividualChannels.test.tsx
          src/features/home-room/model/videoFilterCatalog.test.ts
          src/features/notifications/components/NotificationSettings.saveFailure.test.tsx
          src/features/notifications/components/NotificationToggle.serviceWorker.test.tsx
          src/features/notifications/hooks/useTopicNotificationPreferences.backendFirst.test.ts
          src/features/notifications/push/pushNotifications.serviceWorkerReady.test.ts
          src/pages/about/markdown.lineEndings.test.tsx
          src/pages/schedule/LiveSchedulePage.creatorFilter.test.tsx
          src/pages/schedule/LiveSchedulePage.test.tsx
          src/shared/time/minuteClock.test.tsx
          src/features/live-schedule/components/ScheduleGrid.test.tsx
          src/features/live-schedule/components/StreamNotificationPanel.test.tsx
          src/features/live-schedule/components/StreamDetailModal.test.tsx
          src/features/notifications/api/liveReminderApi.test.ts
          src/features/oshi/components/OshiSettings.test.tsx
          src/features/notifications/components/NotificationMemberAvatars.test.tsx
          src/entities/creator/components/CreatorAvatarImage.test.tsx
          src/pages/about/markdown.articles.test.tsx
          src/features/live-status/components/CreatorStatusList.test.tsx
          src/features/notifications/components/NotificationSettings.test.tsx
          src/features/notifications/components/NotificationToggle.test.tsx
          src/features/notifications/hooks/useTopicNotificationPreferences.test.ts
          src/features/notifications/push/pushNotifications.test.ts
          src/features/oshi/hooks/useDefaultOshiCreator.test.ts
          src/features/home-room/data/recentArchivedLivestreams.test.ts
          src/shared/api/apiClient.test.ts

  # The stable required check. Always runs (even when a test group failed or was skipped) and decides from the results:
  # a group whose scope was detected MUST have succeeded; a group whose scope was not detected must have been skipped.
  pr-required-check:
    needs: [detect-scope, backend-focused-tests, frontend-focused-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide
        env:
          DETECT: ${{ needs.detect-scope.result }}
          BACKEND_SCOPE: ${{ needs.detect-scope.outputs.backend }}
          FRONTEND_SCOPE: ${{ needs.detect-scope.outputs.frontend }}
          BACKEND: ${{ needs.backend-focused-tests.result }}
          FRONTEND: ${{ needs.frontend-focused-tests.result }}
        run: |
          echo "detect-scope=$DETECT backend(scope=$BACKEND_SCOPE)=$BACKEND frontend(scope=$FRONTEND_SCOPE)=$FRONTEND"
          fail=0
          [ "$DETECT" = "success" ] || { echo "scope detection did not succeed"; fail=1; }
          if [ "$BACKEND_SCOPE" = "true" ]; then [ "$BACKEND" = "success" ] || { echo "backend tests required but result=$BACKEND"; fail=1; }
          else [ "$BACKEND" = "skipped" ] || { echo "backend tests unexpectedly result=$BACKEND"; fail=1; }; fi
          if [ "$FRONTEND_SCOPE" = "true" ]; then [ "$FRONTEND" = "success" ] || { echo "frontend tests required but result=$FRONTEND"; fail=1; }
          else [ "$FRONTEND" = "skipped" ] || { echo "frontend tests unexpectedly result=$FRONTEND"; fail=1; }; fi
          exit $fail
