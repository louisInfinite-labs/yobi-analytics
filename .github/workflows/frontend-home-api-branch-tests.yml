name: Frontend branch tests (Home API integration)

# Branch- and task-scoped frontend CI for `feat/home_video_holodex_frontend`: CI only, no deploy.
# It deliberately runs ONLY the focused test files that protect the Home / Oshi Videos / Oshi Status /
# Live Status contracts this branch changed -- never `npm test` / `vitest run` (the full frontend suite).
# To widen coverage, add a file to the explicit list below rather than a directory.
on:
  push:
    branches:
      - feat/home_video_holodex_frontend
    paths:
      - "frontend/dashboard/**"
      - ".github/workflows/frontend-home-api-branch-tests.yml"
  # NOT `pull_request.branches`: that filters the PR's BASE branch, never its head/source branch.
  # A pull_request trigger cannot filter by head branch, so the head branch is checked by the
  # job-level `if` below (github.head_ref). The base branch is intentionally unrestricted, so
  # `feat/home_video_holodex_frontend -> develop` is covered.
  pull_request:
    paths:
      - "frontend/dashboard/**"
      - ".github/workflows/frontend-home-api-branch-tests.yml"

permissions:
  contents: read

# The event name is part of the key, so a push run and a pull_request run for the same commit never cancel
# each other (they are different groups); a newer commit still cancels an older run of the SAME event.
concurrency:
  group: frontend-branch-tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  branch-frontend-tests:
    # A pull request event runs for every PR in the repo; only this branch's PR is in scope.
    if: github.event_name == 'push' || github.head_ref == 'feat/home_video_holodex_frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json

      # `npm ci` installs exactly what package-lock.json declares, so a dependency missing from the
      # repository fails here instead of being hidden by a machine-global install.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      # Existing baseline warnings do not fail the job (oxlint exits 0 on warnings); a lint ERROR does.
      - name: Lint
        run: npm run lint

      - name: Run this branch's focused frontend tests (explicit files only, not the full suite)
        run: >
          npx vitest run
          src/features/home-room/model/oshiVideosQuery.test.ts
          src/features/home-room/data/oshiVideos.test.ts
          src/features/home-room/hooks/useOshiVideos.test.tsx
          src/features/home-room/hooks/useRecentVideos.test.ts
          src/features/home-room/hooks/useRecentVideos.liveStreams.test.ts
          src/features/home-room/hooks/useRecentVideos.latestVideos.test.ts
          src/features/home-room/hooks/useHomeSelectedVideo.test.ts
          src/features/home-room/utils/recentVideosSelection.test.ts
          src/features/home-room/components/RecentVideosSection.test.tsx
          src/features/home-room/components/RecentVideosSection.shelf.test.tsx
          src/features/oshi-status/data/oshiStatus.test.ts
          src/features/oshi-status/hooks/useOshiStatus.test.tsx
          src/features/oshi-status/hooks/useLastVisit.test.ts
          src/features/oshi-status/utils/oshiActivity.test.ts
          src/features/oshi-status/components/OshiStatusPanel.test.tsx
          src/features/live-status/model/creatorStatusSelection.test.ts
          src/features/live-status/hooks/useCreatorStatuses.test.tsx
          src/shared/api/liveStreams.test.ts
          src/shared/api/liveStreamsStore.test.ts
          src/shared/api/hooks/useLiveStreams.test.ts
          src/features/live-schedule/hooks/useWeeklySchedule.test.tsx
          src/shared/i18n/translations.test.ts
